# ─────────────────────────────────────────────────────────────────────────────
#  Override SOLO para desarrollo local.  NO se usa solo:
#  siempre acompañando al compose base (que es el de producción).
#
#      ./dev.sh up            ← atajo (arma el comando completo)
#
#  La estructura de carpetas local espeja la de la VM, así que los `build` y
#  los `volumes` del compose base valen TAL CUAL y acá no se redefinen.
#
#  Qué cambia respecto de producción:
#    · red propia 'voraz_local' (en prod es 'frappe_docker_default', externa a Compose)
#    · puertos remapeados: localhost:3000 ya está ocupado en esta PC
#    · contenedores con sufijo _local  → imposible confundirlos con los de prod
#    · dashwhat2 NO corre (Baileys: una segunda sesión de WhatsApp puede invalidar
#      la de producción). En su lugar, dashwhat_mock sirve el simulador de chat
#      (http://localhost:8880/) y recibe los salientes del backend: tools/mock-dashwhat/
#    · erp_service corre un MOCK en memoria (tools/mock-erp/): en local no hay
#      ERPNext, así arranca sin fallar y los comandos de pedidos funcionan.
#    · Mongo local: NODE_ENV=local → db.js usa la base 'test' (en prod 'dash')
#    · MCP de ERPNext apagado en ia-service
#
#  OJO con `!override`: Compose CONCATENA las listas (ports, volumes, …) en vez de
#  reemplazarlas. Sin ese tag, el contenedor intenta bindear el puerto de producción
#  Y el local a la vez, y falla.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    container_name: voraz_backend_local
    restart: "no"
    ports: !override
      - "3100:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3000
      # db.js: NODE_ENV=local → base 'test'   (producción usa 'dash')
      NODE_ENV: local
      IA_SERVICE_URL: http://ia_service:8000
      ERP_SERVICE_URL: http://erp_service:8001
      DASHWHAT_URL: http://dashwhat_mock:8880
      # Chatwoot NO corre en local: las rutas que lo usan fallan con error de DNS.
      CHATWOOT_URL: http://chatwoot:3000
      CHATWOOT_ACCOUNT_ID: 1
      CHATWOOT_INBOX_IDENTIFIER: local-dev
      CHATWOOT_API_TOKEN: local-dev
      CHATWOOT_INBOX_ID: 4
    depends_on:
      - ia_service
      - erp_service
      - mongo

  # erp_service REAL reemplazado por un MOCK en memoria (ver tools/mock-erp/).
  # En local no hay ERPNext: el erp-service real arranca pero todas sus llamadas
  # al ERP fallan. El mock expone la MISMA superficie HTTP, así el backend y
  # ia_service siguen usando http://erp_service:8001 sin cambiar nada.
  # Para volver al erp-service real: borrá `build`, `volumes` y `environment`,
  # y dejá solo container_name + ports.
  erp_service:
    container_name: erp_service_mock_local
    restart: "no"
    build: ./tools/mock-erp
    ports: !override
      - "8101:8001"
    # !override vacía el volume base (./erp-service:/app): si no, taparía el
    # código del mock copiado dentro de la imagen.
    volumes: !override []
    environment:
      MOCK_ERP_LATENCY_MS: "120"

  ia_service:
    container_name: ia_service_fastapi_local
    restart: "no"
    ports: !override
      - "8100:8000"
    environment:
      # Apaga el MCP de ERPNext (necesita el build/ del server y un ERP real).
      # Ver ia-service/main.py.
      ENABLE_MCP: "false"

  # Mock de dashWhat2 (ver tools/mock-dashwhat/). Cierra el loop de SALIDA:
  # sirve el simulador de chat y recibe los mensajes que el backend manda al
  # cliente/admin (POST /send-message). Sin WhatsApp: no hay sesión de Baileys.
  #   Página:  http://localhost:8880/
  #   Salientes recibidos: GET http://localhost:8880/outbox
  dashwhat_mock:
    build: ./tools/mock-dashwhat
    container_name: dashwhat_mock_local
    restart: "no"
    ports:
      - "8880:8880"
    volumes:
      # El HTML del simulador vive en el repo del backend; se monta read-only.
      - ./backend/backend/tests:/static:ro
    environment:
      STATIC_DIR: /static

  # Solo local: el backend hace process.exit(1) si no conecta a Mongo.
  # Se usa 4.4 y NO la 8: MongoDB ≥5 exige instrucciones AVX y el CPU de esta PC
  # no las tiene (la 8 sale con SIGILL, exit 132).
  # Cuando quieras usar tu base de prueba en Atlas, poné la URI en MONGODB_URI
  # (arriba) y borrá este servicio.
  mongo:
    image: mongo:4.4.18
    container_name: voraz_mongo_local
    restart: "no"
    volumes:
      - mongo_data:/data/db

networks:
  default:
    name: voraz_local
    external: false

volumes:
  mongo_data:
